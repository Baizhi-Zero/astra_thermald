[beast]
description=Beast Mode (Zero throttling, full clocks, physical safety guards retained)
lock_cores_online=1
max_cpu0=2016000
max_cpu2=3148800
max_cpu5=3148800
max_cpu7=3302400
gpu_level=0
throttle_trigger_temp=99000

[esports]
description=Esports Mode (Sustained performance up to 48C, no core unplugging)
lock_cores_online=1
max_cpu0=2016000
max_cpu2=3148800
max_cpu5=3148800
max_cpu7=3302400
gpu_level=0
throttle_trigger_temp=48000

[balance]
description=Balanced Daily Mode (Cool daily experience, full clocks below 42C, 8-tier step-down)
lock_cores_online=1
max_cpu0=2016000
max_cpu2=3148800
max_cpu5=3148800
max_cpu7=3302400
gpu_level=0
throttle_trigger_temp=42000

[stock]
description=Stock Replica Mode (Exact replication of vendor thermal-normal.conf)
lock_cores_online=0
max_cpu0=1804800
max_cpu2=2707200
max_cpu5=2707200
max_cpu7=2745600
gpu_level=4
throttle_trigger_temp=25000
